<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" role="img" aria-label="标杆订单运营看板示意">
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFEDE5"></stop>
      <stop offset="1" stop-color="#E4E1D8"></stop>
    </linearGradient>
    <linearGradient id="d-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#225A4B"></stop>
      <stop offset="1" stop-color="#3E8470"></stop>
    </linearGradient>
    <filter id="d-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#16150F" flood-opacity="0.12"></feDropShadow>
    </filter>
  </defs>

  <rect width="900" height="760" fill="url(#d-bg)"></rect>

  <g filter="url(#d-sh)">
    <rect x="64" y="70" width="772" height="170" rx="20" fill="#16150F"></rect>
  </g>
  <text x="96" y="128" font-family="'Noto Sans SC',sans-serif" font-size="18" fill="#7FB7A6" letter-spacing="2">标杆订单 · 内蒙古移动</text>
  <text x="94" y="200" font-family="'Noto Serif SC',serif" font-size="84" font-weight="600" fill="#FBFAF6">1500<tspan font-size="44" fill="#7FB7A6">万 / 年</tspan></text>
  <g>
    <rect x="600" y="108" width="200" height="100" rx="14" fill="#22332E"></rect>
    <text x="624" y="146" font-family="'Noto Sans SC',sans-serif" font-size="16" fill="#9FCBBD">账号矩阵</text>
    <text x="622" y="188" font-family="'Noto Serif SC',serif" font-size="40" font-weight="600" fill="#FBFAF6">40 <tspan font-size="18" fill="#9FCBBD">个 · 开通中</tspan></text>
  </g>

  <g filter="url(#d-sh)">
    <rect x="64" y="270" width="470" height="420" rx="20" fill="#FBFAF8"></rect>
  </g>
  <text x="96" y="318" font-family="'Noto Sans SC',sans-serif" font-size="18" font-weight="600" fill="#16150F">月度成单 · 持续爬坡</text>
  <g>
    <rect x="100" y="600" width="48" height="58" rx="6" fill="url(#d-bar)" opacity="0.55"></rect>
    <rect x="168" y="560" width="48" height="98" rx="6" fill="url(#d-bar)" opacity="0.65"></rect>
    <rect x="236" y="512" width="48" height="146" rx="6" fill="url(#d-bar)" opacity="0.75"></rect>
    <rect x="304" y="468" width="48" height="190" rx="6" fill="url(#d-bar)" opacity="0.85"></rect>
    <rect x="372" y="412" width="48" height="246" rx="6" fill="url(#d-bar)"></rect>
    <rect x="440" y="372" width="48" height="286" rx="6" fill="#E25A4A"></rect>
    <line x1="96" y1="658" x2="500" y2="658" stroke="#16150F" stroke-opacity="0.12" stroke-width="2"></line>
  </g>

  <g filter="url(#d-sh)">
    <rect x="558" y="270" width="278" height="200" rx="20" fill="#FBFAF8"></rect>
  </g>
  <text x="588" y="316" font-family="'Noto Sans SC',sans-serif" font-size="17" font-weight="600" fill="#16150F">账号矩阵覆盖</text>
  <g fill="#1F3A5F">
    <g>
      <circle cx="592" cy="350" r="7"></circle><circle cx="626" cy="350" r="7"></circle><circle cx="660" cy="350" r="7"></circle><circle cx="694" cy="350" r="7"></circle><circle cx="728" cy="350" r="7"></circle><circle cx="762" cy="350" r="7"></circle><circle cx="796" cy="350" r="7" opacity="0.4"></circle>
      <circle cx="592" cy="384" r="7"></circle><circle cx="626" cy="384" r="7"></circle><circle cx="660" cy="384" r="7"></circle><circle cx="694" cy="384" r="7"></circle><circle cx="728" cy="384" r="7" opacity="0.4"></circle><circle cx="762" cy="384" r="7" opacity="0.4"></circle><circle cx="796" cy="384" r="7" opacity="0.4"></circle>
      <circle cx="592" cy="418" r="7"></circle><circle cx="626" cy="418" r="7"></circle><circle cx="660" cy="418" r="7" opacity="0.4"></circle><circle cx="694" cy="418" r="7" opacity="0.4"></circle><circle cx="728" cy="418" r="7" opacity="0.4"></circle><circle cx="762" cy="418" r="7" opacity="0.4"></circle><circle cx="796" cy="418" r="7" opacity="0.4"></circle>
    </g>
  </g>

  <g filter="url(#d-sh)">
    <rect x="558" y="490" width="278" height="200" rx="20" fill="#1F3A5F"></rect>
  </g>
  <text x="588" y="538" font-family="'Noto Sans SC',sans-serif" font-size="17" font-weight="600" fill="#EAF3EF">单位经济模型</text>
  <text x="588" y="592" font-family="'Noto Serif SC',serif" font-size="52" font-weight="600" fill="#FBFAF6">3 <tspan font-size="22" fill="#BFE0D5">张卡 / 天</tspan></text>
  <text x="588" y="630" font-family="'Noto Sans SC',sans-serif" font-size="16" fill="#BFE0D5">即可保本 · 已验证为正</text>
  <text x="588" y="662" font-family="'Noto Sans SC',sans-serif" font-size="14" fill="#9FCBBD">单直播间年成本约 29.7 万元</text>
</svg>
